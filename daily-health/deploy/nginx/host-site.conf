# Way 1: the VPS's own Nginx (already serving other sites) in front of the API container.
# __API_DOMAIN__ and __API_HOST_PORT__ are filled in when copying (see the API README).
# HTTPS: `sudo certbot --nginx -d <domain>` adds the 443 block and the redirect to this file.

# Own name so it cannot clash with a `map` in the other sites' configs.
map $http_upgrade $daily_health_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    # A little above the API's MAX_UPLOAD_BYTES (10 MB, core/uploads/upload-limits.ts).
    client_max_body_size 11m;

    location / {
        proxy_pass http://127.0.0.1:__API_HOST_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.io (chat and call signalling) keeps connections open.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $daily_health_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
