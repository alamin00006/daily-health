# VPS stack: Postgres (PostGIS), Redis and the API; HTTPS comes from Nginx in front.
# Settings: deploy/.env (see .env.production.example). Run from this folder.
#
# Two ways to put Nginx in front (see the API README, "VPS-এ চালু করা"):
#   1. The VPS already runs Nginx for other sites: start without a profile and point that
#      Nginx at 127.0.0.1:${API_HOST_PORT} (nginx/host-site.conf):
#        docker compose -f docker-compose.prod.yml up -d --build
#   2. Nothing else uses ports 80/443: let this stack run its own Nginx + Let's Encrypt:
#        bash init-ssl.sh        (uses the "bundled-nginx" profile)
#
# The API port is bound to 127.0.0.1 only; nothing but Nginx is reachable from outside.
name: daily-health-prod

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies new migrations, then exits. The API starts only after it succeeds.
  migrate:
    build:
      context: ..
      target: tools
    image: daily-health-api-tools
    env_file: .env
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ..
      target: runtime
    image: daily-health-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      # Localhost only: the VPS's own Nginx proxies to it (way 1).
      - '127.0.0.1:${API_HOST_PORT:-3010}:3000'

  # Way 2 only (bash init-ssl.sh): our own Nginx when nothing else holds ports 80/443.
  nginx:
    image: nginx:1.27-alpine
    profiles: ['bundled-nginx']
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/api.conf.template:/etc/nginx/templates/api.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_started

  # Not a running service: used with `docker compose run --rm certbot ...` by
  # init-ssl.sh and the renewal cron job.
  certbot:
    image: certbot/certbot:v3.0.1
    profiles: ['bundled-nginx']
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  postgres-data:
  redis-data:
