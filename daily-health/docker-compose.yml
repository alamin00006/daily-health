# Local development services. Production uses its own compose file on the VPS.
name: daily-health

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daily_health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daily_health}
      POSTGRES_DB: ${POSTGRES_DB:-daily_health}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP that catches every email (OTP codes, invites). Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  # Serves storage/public and signed storage/private URLs, like Nginx on the VPS.
  file-server:
    image: nginx:1.28-alpine
    restart: unless-stopped
    environment:
      FILE_URL_SIGNING_SECRET: ${FILE_URL_SIGNING_SECRET:?set FILE_URL_SIGNING_SECRET in .env}
    ports:
      - '${FILE_SERVER_PORT:-8080}:80'
    volumes:
      # Rendered as conf.d/default.conf, replacing the image's stock "localhost"
      # server block that would otherwise answer every request with 404.
      - ./docker/nginx/templates/file-server.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./storage:/srv/storage:ro

volumes:
  postgres-data:
  redis-data:
